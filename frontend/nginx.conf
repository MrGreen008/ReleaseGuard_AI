server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;

    location /api/ {
        proxy_pass http://guardian:8080;
        proxy_read_timeout 255s;
        proxy_hide_header WWW-Authenticate;
        client_max_body_size 16k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
